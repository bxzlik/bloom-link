<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#000;
  color:#fff;
  font-family:-apple-system,'SF Pro Display','SF Pro Text','Segoe UI','Roboto',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* фоновая надпись BLOOM — во всю ширину экрана, еле видная */
.wordmark{
  position:fixed;
  inset:0;
  z-index:0;
  display:flex;
  align-items:center;
  justify-content:center;
  pointer-events:none;
  user-select:none;
  -webkit-user-select:none;
}
.wordmark svg{
  display:block;
  width:100%;
  height:auto;
}
.wordmark text{
  font-family:inherit;
  font-weight:900;
  letter-spacing:-.02em;
  fill:rgba(255,255,255,.028);
}

.cursor{
  position:fixed;
  top:0;
  left:0;
  width:30px;
  height:30px;
  pointer-events:none;
  z-index:3;
  opacity:0;
  transform:translate3d(-50%,-50%,0);
  transition:opacity .18s ease;
  will-change:transform;
}

.cursor img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:.9;
  transform-origin:center center;
  transition:transform .2s cubic-bezier(.18,.8,.22,1),opacity .18s ease;
}

.cursor.is-visible{
  opacity:1;
}

.cursor.is-hover img{
  transform:scale(1.25);
  opacity:1;
}

@media (hover: hover) and (pointer: fine) {
  body.cursor-enabled,
  body.cursor-enabled button{
    cursor:none;
  }
}

.card{
  position:relative;
  z-index:1;
  width:380px;
  background:#000;
  border:1px solid rgba(255,255,255,.09);
  border-radius:28px;
  overflow:hidden;
  padding:20px 20px 22px;
  opacity:0;
  transform:translateY(18px) scale(.985);
  transform-origin:center center;
  transition:opacity .65s ease,transform .8s cubic-bezier(.18,.8,.22,1);
  will-change:transform,opacity;
}

.card.is-visible{
  opacity:1;
}

/* header */
.card-header{
  display:flex;
  align-items:center;
  gap:11px;
  padding-bottom:18px;
  border-bottom:1px solid rgba(255,255,255,.07);
  margin-bottom:18px;
}
.card-avatar{
  width:38px;height:38px;
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  overflow:hidden;
}
.card-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.card-meta{display:flex;flex-direction:column;gap:2px;}
.card-name{font-size:13px;font-weight:700;color:#fff;letter-spacing:-.1px;}
.card-action{font-size:11px;color:rgba(255,255,255,.35);}

/* cover */
.cover{
  width:100%;
  aspect-ratio:1;
  border-radius:16px;
  background:#1a1a1a;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  margin-bottom:16px;
}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover svg{opacity:.15;}

/* badge */
.badge{
  font-size:9px;font-weight:800;letter-spacing:.12em;
  color:rgba(255,255,255,.28);
  text-transform:uppercase;
  text-align:center;
  margin-bottom:6px;
}

/* text */
.track-title{
  font-size:22px;font-weight:700;
  text-align:center;line-height:1.22;
  color:#fff;
  margin-bottom:6px;
  padding:0 4px;
}
.track-artist{
  font-size:13px;color:rgba(255,255,255,.36);
  text-align:center;
  padding:0 4px;
  margin-bottom:20px;
}

/* footer */
.card-footer{
  display:flex;
  align-items:center;
  padding-top:18px;
  border-top:1px solid rgba(255,255,255,.07);
}
.footer-sc{
  font-size:12px;font-weight:500;color:rgba(255,255,255,.26);
  background:none;border:none;padding:0;cursor:pointer;
  transition:color .15s;
  text-align:left;
}
.footer-sc:hover{color:rgba(255,255,255,.6);}
.footer-open{
  margin-left:auto;
  width:40px;height:40px;
  border-radius:50%;
  background:#fff;
  color:#000;
  display:flex;align-items:center;justify-content:center;
  border:none;cursor:pointer;
  transition:opacity .15s,transform .12s;
  flex-shrink:0;
}
.footer-open:hover{opacity:.82;}
.footer-open:active{transform:scale(.93);}

.profile-row{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:14px;
}
.pr-avatar{
  width:64px;height:64px;
  border-radius:50%;
  background:#1a1a1a;
  flex-shrink:0;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;font-weight:700;color:rgba(255,255,255,.4);
}
.pr-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.pr-info{flex:1;min-width:0;}
.pr-name{font-size:22px;font-weight:700;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.2;}
.pr-bio{font-size:12px;color:rgba(255,255,255,.36);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.profile-stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:20px;
}
.ps-cell{
  background:rgba(255,255,255,.06);
  border-radius:10px;
  padding:12px 10px 10px;
}
.ps-val{
  font-size:20px;font-weight:800;color:#fff;
  margin-bottom:4px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.ps-lbl{
  font-size:8px;font-weight:700;letter-spacing:.1em;
  color:rgba(255,255,255,.35);text-transform:uppercase;
}
</style>
</head>
<body>
<div class="wordmark" aria-hidden="true">
  <svg viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet">
    <text x="500" y="449" text-anchor="middle" font-size="470"
          textLength="1000" lengthAdjust="spacingAndGlyphs">BLOOM</text>
  </svg>
</div>
<div class="cursor" id="cursor"><img src="logo.png" alt=""></div>
<div class="card">
  <div class="card-header">
    <div class="card-avatar">
      <img src="logo.png" alt="Bloom">
    </div>
    <div class="card-meta">
      <div class="card-name">Bloom</div>
      <div class="card-action" id="cardAction">shared a track</div>
    </div>
  </div>

  <div class="cover" id="cover">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </div>

  <div class="badge" id="badge" style="display:none"></div>
  <div class="track-title" id="title">Трек</div>
  <div class="track-artist" id="artist"></div>

  <div class="card-footer">
    <button class="footer-sc" id="scBtn" style="visibility:hidden" onclick="openSc()">Открыть на SoundCloud →</button>
    <button class="footer-open" onclick="tryOpen()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </button>
  </div>
</div>

<script>
(function(){
  var customCursor = document.getElementById('cursor');
  var card = document.querySelector('.card');
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  var finePointer = window.matchMedia('(hover: hover) and (pointer: fine)');
  var cursorRafId = 0;
  var cardRafId = 0;
  var cursorEnabled = false;
  var cursorTarget = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  var cursorCurrent = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
  var cardPointer = { x: 0, y: 0 };
  var cardTilt = { x: 0, y: 0 };
  var cardVisible = false;
  var maxTilt = 1.6;

  function renderCursor() {
    cursorCurrent.x += (cursorTarget.x - cursorCurrent.x) * 0.22;
    cursorCurrent.y += (cursorTarget.y - cursorCurrent.y) * 0.22;
    customCursor.style.transform = 'translate3d(' + cursorCurrent.x + 'px,' + cursorCurrent.y + 'px,0) translate(-50%,-50%)';
    cursorRafId = window.requestAnimationFrame(renderCursor);
  }

  function applyCardTransform() {
    var baseY = cardVisible ? 0 : 18;
    var baseScale = cardVisible ? 1 : 0.985;
    var rotateX = reduceMotion.matches ? 0 : cardTilt.y;
    var rotateY = reduceMotion.matches ? 0 : cardTilt.x;
    card.style.transform =
      'translateY(' + baseY + 'px) ' +
      'scale(' + baseScale + ') ' +
      'perspective(1200px) ' +
      'rotateX(' + rotateX + 'deg) ' +
      'rotateY(' + rotateY + 'deg)';
  }

  function renderCardTilt() {
    cardTilt.x += (cardPointer.x - cardTilt.x) * 0.1;
    cardTilt.y += (cardPointer.y - cardTilt.y) * 0.1;
    applyCardTransform();
    cardRafId = window.requestAnimationFrame(renderCardTilt);
  }

  function startCardTilt() {
    if (!cardRafId && !reduceMotion.matches) {
      cardRafId = window.requestAnimationFrame(renderCardTilt);
    }
  }

  function stopCardTilt() {
    cardPointer.x = 0;
    cardPointer.y = 0;
    if (cardRafId) {
      window.cancelAnimationFrame(cardRafId);
      cardRafId = 0;
    }
    applyCardTransform();
  }

  function revealCard() {
    window.requestAnimationFrame(function() {
      cardVisible = true;
      card.classList.add('is-visible');
      applyCardTransform();
    });
  }

  function startCursor() {
    if (cursorEnabled) return;
    cursorEnabled = true;
    document.body.classList.add('cursor-enabled');
    // показываем логотип только после первого движения мыши,
    // иначе он висит по центру экрана при загрузке
    cursorRafId = window.requestAnimationFrame(renderCursor);
  }

  function stopCursor() {
    cursorEnabled = false;
    document.body.classList.remove('cursor-enabled');
    customCursor.classList.remove('is-visible');
    customCursor.classList.remove('is-hover');
    if (cursorRafId) {
      window.cancelAnimationFrame(cursorRafId);
      cursorRafId = 0;
    }
  }

  function syncCursorMode() {
    if (finePointer.matches) {
      startCursor();
      startCardTilt();
    } else {
      stopCursor();
      stopCardTilt();
    }
  }

  window.addEventListener('mousemove', function(event) {
    cursorTarget.x = event.clientX;
    cursorTarget.y = event.clientY;
    if (cursorEnabled) {
      customCursor.classList.add('is-visible');
    }
  });
  window.addEventListener('mouseleave', function() {
    customCursor.classList.remove('is-visible');
    cardPointer.x = 0;
    cardPointer.y = 0;
  });
  window.addEventListener('touchstart', function() {
    stopCursor();
  }, { passive: true });

  document.addEventListener('mouseover', function(event) {
    if (!cursorEnabled) return;
    var target = event.target.closest('button, a');
    customCursor.classList.toggle('is-hover', !!target);
  });

  card.addEventListener('mousemove', function(event) {
    if (reduceMotion.matches) return;
    var rect = card.getBoundingClientRect();
    var offsetX = (event.clientX - rect.left) / rect.width - 0.5;
    var offsetY = (event.clientY - rect.top) / rect.height - 0.5;
    cardPointer.x = offsetX * maxTilt * 2;
    cardPointer.y = offsetY * maxTilt * -2;
  });

  card.addEventListener('mouseleave', function() {
    cardPointer.x = 0;
    cardPointer.y = 0;
  });

  if (typeof finePointer.addEventListener === 'function') {
    finePointer.addEventListener('change', syncCursorMode);
  }

  if (typeof reduceMotion.addEventListener === 'function') {
    reduceMotion.addEventListener('change', function(event) {
      if (event.matches) {
        stopCardTilt();
      } else if (finePointer.matches) {
        startCardTilt();
      }
      applyCardTransform();
    });
  }

  syncCursorMode();
  applyCardTransform();
  revealCard();

  var p = new URLSearchParams(location.search);
  var type      = p.get('type') || 'track';
  var permalink = p.get('permalink') || '';
  var cover     = p.get('cover')     || '';

  var mainTitle, subTitle, actionText, badgeText, bloomUrl;
  if (type === 'profile') {
    mainTitle  = p.get('name')   || 'Пользователь';
    subTitle   = '';
    actionText = 'shared their profile';
    badgeText  = null;
    bloomUrl   = 'bloom://profile?' + p.toString();
  } else if (type === 'artist') {
    mainTitle  = p.get('name')   || 'Артист';
    subTitle   = '';
    actionText = 'shared an artist';
    badgeText  = 'АРТИСТ';
    bloomUrl   = 'bloom://artist?' + p.toString();
  } else if (type === 'playlist') {
    mainTitle  = p.get('title')  || 'Плейлист';
    subTitle   = p.get('artist') || '';
    actionText = 'shared a playlist';
    badgeText  = 'ПЛЕЙЛИСТ';
    bloomUrl   = 'bloom://playlist?' + p.toString();
  } else if (type === 'album') {
    mainTitle  = p.get('title')  || 'Альбом';
    subTitle   = p.get('artist') || '';
    actionText = 'shared an album';
    badgeText  = 'АЛЬБОМ';
    bloomUrl   = 'bloom://album?' + p.toString();
  } else {
    mainTitle  = p.get('title')  || 'Трек';
    subTitle   = p.get('artist') || '';
    actionText = 'shared a track';
    badgeText  = null;
    bloomUrl   = 'bloom://play?' + p.toString();
  }

  document.getElementById('cardAction').textContent = actionText;
  document.getElementById('title').textContent      = mainTitle;
  document.getElementById('artist').textContent     = subTitle;
  document.title = mainTitle + ' — Bloom';

  if (type === 'profile') {
    var tracksN = p.get('tracks') || '0';
    var plays2  = p.get('plays')  || '0';
    var time2   = p.get('time')   || '0 мин';
    var top2    = p.get('artist') || '—';
    var avatar  = p.get('avatar') || '';
    var bio     = p.get('bio')    || '';

    // replace cover with profile row
    var coverEl = document.getElementById('cover');
    var avatarHtml = avatar
      ? '<img src="' + avatar + '" alt="" onerror="this.parentNode.textContent=\'' + (mainTitle||'?').charAt(0).toUpperCase() + '\'">'
      : (mainTitle||'?').charAt(0).toUpperCase();
    coverEl.className = 'profile-row';
    coverEl.removeAttribute('style');
    coverEl.innerHTML =
      '<div class="pr-avatar">' + avatarHtml + '</div>' +
      '<div class="pr-info"><div class="pr-name">' + mainTitle + '</div>' +
      (bio ? '<div class="pr-bio">' + bio + '</div>' : '') +
      '</div>';

    // hide badge and title (name is already in profile row)
    document.getElementById('badge').style.display = 'none';
    document.getElementById('title').style.display = 'none';

    // replace artist with stats grid
    document.getElementById('artist').outerHTML =
      '<div class="profile-stats">' +
        '<div class="ps-cell"><div class="ps-val">' + tracksN + '</div><div class="ps-lbl">Треков</div></div>' +
        '<div class="ps-cell"><div class="ps-val">' + plays2  + '</div><div class="ps-lbl">Прослушано</div></div>' +
        '<div class="ps-cell"><div class="ps-val">' + time2   + '</div><div class="ps-lbl">Время прослушивания</div></div>' +
        '<div class="ps-cell"><div class="ps-val" style="font-size:14px">' + top2 + '</div><div class="ps-lbl">Любимый исполнитель</div></div>' +
      '</div>';
  }

  if (badgeText) {
    var b = document.getElementById('badge');
    b.textContent = badgeText;
    b.style.display = '';
  }

  if (cover && type !== 'profile') {
    var hires = cover.replace('-large.', '-t500x500.').replace('-small.', '-t500x500.');
    var img = new Image();
    img.onload = function() {
      document.getElementById('cover').innerHTML = '<img src="' + img.src + '" alt="">';
    };
    img.onerror = function() { if (img.src !== cover) img.src = cover; };
    img.src = hires;
  }

  if (permalink) {
    document.getElementById('scBtn').style.visibility = '';
  }

  window.tryOpen = function(){ window.location.href = bloomUrl; };
  window.openSc  = function(){ if (permalink) window.open(permalink, '_blank'); };

  tryOpen();
})();
</script>
</body>
</html>
